name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + seed + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply schema to SQLite database
        run: bun run db:push

      - name: Seed demo school (fabricated data)
        run: |
          bunx tsx scripts/seed.ts
          bunx tsx scripts/seed-extras.ts

      - name: Lint
        run: bun run lint

      - name: Start dev server
        run: |
          bun run dev &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://localhost:3000; then
              echo "Server is up after $((i * 2))s"
              break
            fi
            sleep 2
          done
          curl -s -o /dev/null http://localhost:3000 || (echo "::error::Dev server did not start" && exit 1)

      - name: Domain + API integration tests
        run: bun test tests/domain.test.ts tests/api.test.ts
